[workspace]
members = [".", "crates/pxui", "crates/audio"]

[package]
name = "fluyer-low"
version = "0.1.0"
edition = "2021"

[dependencies]
fluyer-audio = { path = "crates/audio" }
fluyer-pxui = { path = "crates/pxui" }
winit = "0.30"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
